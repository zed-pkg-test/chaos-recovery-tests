[package]
org = "zed-pkg-test"
name = "chaos-recovery-tests"
version = "0.2.0"
description = "Deterministic fault injection and black-box interactive crash recovery for host and OCI runtimes."
license = "MIT"
language = "python"

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg-test/chaos-recovery-tests"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".venv/**", ".vendor/**", "vendor/**", "artifacts/**", "**/__pycache__/**", "**/*.pyc", ".pytest_cache/**"]

[install]
dir = ".vendor/.zed"
adapter = "none"

[scripts]
test = "PYTHONPATH=src python -m unittest discover -s tests -v && python scripts/verify_repository.py"
